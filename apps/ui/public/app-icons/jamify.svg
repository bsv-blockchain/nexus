<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 342" width="342" height="342">
  <title>Jamify</title>
  <!--
    Jamify's circular mark, lifted from their full logo.

    Their published file is the lockup: a 342px disc with the glyph on it, then
    the wordmark laid out to its right across a 1101x342 canvas. An app tile is
    square, so the words are dropped and the viewBox is cropped to the disc.
    Nothing is redrawn: this is their circle, their glyph and their gradient.
  -->
