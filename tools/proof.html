<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Hoisted to the earliest possible script position (only the charset meta may
       precede it, for encoding correctness). This matters for the gate it measures:
       Android WebView has no true document-start hook, so a capture point further
       down the document would pass even when a real page's first head script would
       have missed the provider. Keep this ABOVE the viewport meta, title and style. -->
  <script>
    window.__proof = {
      nexusType: typeof window.nexus,
      injectedAt: window.__nexusInjectedAt || null,
      firstScriptAt: Date.now(),
      readyState: document.readyState
    }

    // Registered in this same first script so a late (racy) dispatch is still caught.
    // If injection already happened before this ran, the event necessarily fired
    // earlier and no listener could observe it — seed the flag from injectedAt.
    window.__nexusReadyFired = window.__proof.injectedAt !== null
    window.addEventListener('nexus:ready', function () {
      window.__nexusReadyFired = true
    })
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Document-Start Proof</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
    }

    .pass {
      color: #22c55e;
    }

    .fail {
      color: #ef4444;
    }

    .table-section {
      margin: 30px 0;
    }

    .table-section h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #1f2937;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      font-size: 16px;
    }

    th {
      background: #f9fafb;
      font-weight: 600;
      color: #374151;
    }

    td {
      word-break: break-all;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 13px;
    }

    .button-section {
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .button-section h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #1f2937;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    button {
      flex: 1;
      min-width: 150px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    button:active {
      background: #1d4ed8;
    }

    .result-display {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px;
      margin-top: 8px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      word-break: break-all;
      min-height: 40px;
      display: flex;
      align-items: center;
    }

    .result-display.success {
      background: #ecfdf5;
      border-color: #d1fae5;
      color: #065f46;
    }

    .result-display.error {
      background: #fef2f2;
      border-color: #fee2e2;
      color: #991b1b;
    }

    .timing {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .ready-state {
      margin: 30px 0;
      padding: 15px;
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      border-radius: 4px;
      font-size: 16px;
    }

    .ready-state.yes {
      background: #ecfdf5;
      border-color: #10b981;
    }

    .ready-state.no {
      background: #fef2f2;
      border-color: #ef4444;
    }
  </style>
</head>
<body>
<div class="container">
  <h1 id="headline" class="fail">FAIL</h1>

  <div class="table-section">
    <h2>Document-Start Proof</h2>
    <table>
      <thead>
        <tr>
          <th>Property</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>nexusType</td>
          <td id="proof-nexusType"></td>
        </tr>
        <tr>
          <td>injectedAt</td>
          <td id="proof-injectedAt"></td>
        </tr>
        <tr>
          <td>firstScriptAt</td>
          <td id="proof-firstScriptAt"></td>
        </tr>
        <tr>
          <td>readyState</td>
          <td id="proof-readyState"></td>
        </tr>
        <tr>
          <td>navigator.userAgent</td>
          <td id="proof-userAgent"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="button-section">
    <h2>Provider Methods</h2>
    <div class="button-row">
      <button onclick="callPing()">nexus.ping()</button>
      <button onclick="callGetVersion()">nexus.getVersion()</button>
      <button onclick="callGetPublicKey()">nexus.getPublicKey()</button>
    </div>
    <div id="results-container"></div>
  </div>

  <div id="ready-state-line" class="ready-state no">
    nexus:ready event did NOT fire before DOMContentLoaded
  </div>
</div>

<script>
// Populate proof table
function populateProofTable() {
  document.getElementById('proof-nexusType').textContent = window.__proof.nexusType
  document.getElementById('proof-injectedAt').textContent = window.__proof.injectedAt === null ? 'null' : new Date(window.__proof.injectedAt).toISOString()
  document.getElementById('proof-firstScriptAt').textContent = new Date(window.__proof.firstScriptAt).toISOString()
  document.getElementById('proof-readyState').textContent = window.__proof.readyState
  document.getElementById('proof-userAgent').textContent = navigator.userAgent

  // Update headline
  const headline = document.getElementById('headline')
  if (window.__proof.nexusType === 'object') {
    headline.textContent = 'PASS'
    headline.classList.remove('fail')
    headline.classList.add('pass')
  } else {
    headline.textContent = 'FAIL'
    headline.classList.remove('pass')
    headline.classList.add('fail')
  }
}

function callProviderMethod(methodName, displayName) {
  const startTime = Date.now()
  const resultsContainer = document.getElementById('results-container')
  const resultDiv = document.createElement('div')
  resultDiv.style.marginBottom = '20px'

  // Guard against missing window.nexus
  if (typeof window.nexus === 'undefined' || window.nexus === null) {
    const elapsed = Date.now() - startTime
    resultDiv.innerHTML = `
      <strong>${displayName}</strong>
      <div class="result-display error">window.nexus is not available</div>
      <div class="timing">Error (${elapsed}ms)</div>
    `
    resultsContainer.appendChild(resultDiv)
    return
  }

  if (typeof window.nexus[methodName] !== 'function') {
    const elapsed = Date.now() - startTime
    resultDiv.innerHTML = `
      <strong>${displayName}</strong>
      <div class="result-display error">Method not available: ${methodName}</div>
      <div class="timing">Error (${elapsed}ms)</div>
    `
    resultsContainer.appendChild(resultDiv)
    return
  }

  try {
    const promise = window.nexus[methodName]()
    if (promise && typeof promise.then === 'function') {
      promise
        .then(result => {
          const elapsed = Date.now() - startTime
          resultDiv.innerHTML = `
            <strong>${displayName}</strong>
            <div class="result-display success">${JSON.stringify(result)}</div>
            <div class="timing">Success (${elapsed}ms)</div>
          `
          resultsContainer.appendChild(resultDiv)
        })
        .catch(err => {
          const elapsed = Date.now() - startTime
          resultDiv.innerHTML = `
            <strong>${displayName}</strong>
            <div class="result-display error">${String(err.message || err)}</div>
            <div class="timing">Error (${elapsed}ms)</div>
          `
          resultsContainer.appendChild(resultDiv)
        })
    } else {
      const elapsed = Date.now() - startTime
      resultDiv.innerHTML = `
        <strong>${displayName}</strong>
        <div class="result-display success">${JSON.stringify(promise)}</div>
        <div class="timing">Sync (${elapsed}ms)</div>
      `
      resultsContainer.appendChild(resultDiv)
    }
  } catch (err) {
    const elapsed = Date.now() - startTime
    resultDiv.innerHTML = `
      <strong>${displayName}</strong>
      <div class="result-display error">${String(err.message || err)}</div>
      <div class="timing">Sync Error (${elapsed}ms)</div>
    `
    resultsContainer.appendChild(resultDiv)
  }
}

function callPing() {
  callProviderMethod('ping', 'nexus.ping()')
}

function callGetVersion() {
  callProviderMethod('getVersion', 'nexus.getVersion()')
}

function callGetPublicKey() {
  callProviderMethod('getPublicKey', 'nexus.getPublicKey()')
}

// Update the ready-state line on DOMContentLoaded
document.addEventListener('DOMContentLoaded', () => {
  populateProofTable()

  const readyStateDiv = document.getElementById('ready-state-line')
  if (window.__nexusReadyFired) {
    readyStateDiv.textContent = 'nexus:ready event fired BEFORE DOMContentLoaded'
    readyStateDiv.classList.remove('no')
    readyStateDiv.classList.add('yes')
  } else {
    readyStateDiv.textContent = 'nexus:ready event did NOT fire before DOMContentLoaded'
    readyStateDiv.classList.remove('yes')
    readyStateDiv.classList.add('no')
  }
})
</script>
</body>
</html>
