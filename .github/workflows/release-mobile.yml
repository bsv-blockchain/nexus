# Mobile release: store builds and a sideloadable APK — on version tags ONLY,
# the same trigger as release-desktop.yml. Cutting a release is `npm run release`.
#
# Three legs:
#
#   aab              production AAB on EAS's builders, auto-submitted to Play's
#                    INTERNAL testing track, and also attached to the tag's draft
#                    GitHub release.
#
#                    v0.1.0 died here on "Google Service Account Keys cannot be set
#                    up in --non-interactive mode". The account now exists and its
#                    key is in EAS credentials. Its Play permissions are scoped so
#                    that "Release to production" is NOT granted — the most this
#                    credential can do is reach internal testers. Promotion to
#                    production stays a human act in Play Console, by design and now
#                    also by permission.
#
#   stores-ios       production IPA on EAS's builders, auto-submitted to TestFlight.
#                    eas.json now carries submit.production.ios.ascAppId
#                    (6797608340), which non-interactive submission requires — with
#                    an empty profile eas-cli refuses rather than resolving the id.
#                    Runs on macOS because the two Rust xcframeworks
#                    (SecpNative/EngineNative) are gitignored build products that
#                    exist only on dev machines — CI must rebuild them from the
#                    tracked Rust sources before the EAS archive is taken, or pod
#                    install dies on the EAS builder every time.
#
#   apk              signed installable APK (preview profile) for testers who
#                    sideload, attached to the tag's draft GitHub release beside the
#                    desktop artifacts. Android needs no xcframeworks — its native
#                    modules compile from tracked source on the EAS builder.
#
# No `--no-wait` anywhere: a queued-then-failed EAS build must fail THIS run, not
# silently evaporate behind a green checkmark.
#
# ── REHEARSAL, THE SAME AS release-desktop.yml HAS ──
#
# Dispatching this on a BRANCH builds every leg for real and distributes nothing:
# no --auto-submit, so no TestFlight build and no Play internal-testing release, and
# nothing is attached to a GitHub release. The AAB and APK are uploaded to the run's
# own Artifacts panel instead, so a rehearsal still hands you installable binaries.
#
#   gh workflow run release-mobile.yml --ref my-branch
#
# This used to refuse a branch outright, which meant the ONLY way to find out
# whether the mobile release path worked was to cut a tag — and the desktop workflow
# already records what that costs: "a tag cannot be un-cut", and v0.1.0 was spent
# discovering that apps/desktop/build had never been committed. The mobile side had
# its own version of that lesson (v0.1.0 died on a Google service-account prompt),
# which a rehearsal would have caught for the price of runner minutes.
#
# The asymmetry mattered more here than on desktop, because these legs push to real
# distribution channels: a submitted TestFlight build consumes a build number and is
# visible to testers. Rehearsal is how you find a broken pipeline without doing that.
name: release-mobile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Two modes, decided by the ref — the same split release-desktop.yml makes:
      #
      #   a vX.Y.Z tag   a real release. Metadata must agree with the tag, the store
      #                  legs auto-submit, and the artifacts land on the draft release.
      #   any branch     a REHEARSAL. Every leg builds for real; nothing is submitted
      #                  and nothing is attached.
      #
      # Dispatch a TAG ref to re-run a release; dispatch a branch to rehearse one.
      - run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node tools/version.mjs --check --tag "$GITHUB_REF_NAME"
          else
            echo "::notice title=Rehearsal::'$GITHUB_REF_NAME' is not a version tag — building every leg, submitting and attaching nothing."
            node tools/version.mjs --check
          fi

  aab:
    needs: verify-version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: install dependencies
        run: |
          npm ci
          npm ci --prefix apps/ui

      - name: bundle the chrome
        run: npm run ui:bundle

      # --auto-submit is back: the Google service account exists now
      # (play-store-service-account@bsva-469618), its key is in EAS credentials, and a
      # submission of build 4c1933cd proved the path end to end before this landed.
      # Its Play permissions deliberately exclude "Release to production", so the worst
      # this key can do is put a build in front of internal testers.
      #
      # The AAB is STILL downloaded and attached to the draft release. Auto-submit sends
      # it to internal testing; the attachment is what you archive, hand to someone
      # without Play access, or upload by hand the day EAS is down.
      # --auto-submit only on a tag. On a branch this is a rehearsal: the AAB is built
      # and downloaded, and Play never hears about it.
      #
      # SLUG, not GITHUB_REF_NAME, in the filename: a branch ref can contain a slash
      # ('feat/web3-apps'), and `curl -o Nexus-feat/web3-apps.aab` writes into a
      # directory that does not exist. Tags never hit this, which is why it survived
      # until branches became a legal ref here.
      - name: build AAB (submit to Play internal testing on a tag)
        working-directory: apps/mobile
        run: |
          SLUG="${GITHUB_REF_NAME//\//-}"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          SUBMIT=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SUBMIT=(--auto-submit)
          else
            echo "::notice::rehearsal — building the production AAB without submitting it to Play"
          fi
          eas build --platform android --profile production --non-interactive "${SUBMIT[@]}" --json > build.json
          URL=$(node -p "JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.buildUrl")
          curl -fL "$URL" -o "Nexus-${SLUG}.aab"

      # So a rehearsal still yields an installable binary, the way the desktop
      # rehearsal does. Cheap on a tag run too, and it outlives the draft.
      - name: upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-aab
          path: apps/mobile/Nexus-*.aab

      # Same draft-release protocol as the apk job and release-desktop.yml — see the
      # comment there. Three writers now share it; keep-OLDEST is what makes that safe.
      - name: attach AAB to the draft release
        # Tags only: a rehearsal must not leave a draft behind for a version nobody
        # cut. The AAB is in this run's Artifacts panel either way.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$TAG is already published — releases are immutable, cut a new version"
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Nexus ${TAG}" --notes "Nexus ${TAG} — built from ${GITHUB_SHA}" || true
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.draft and .tag_name == \"$TAG\")] | sort_by(.created_at) | .[1:] | .[].id" |
            while read -r id; do
              echo "removing duplicate draft $id (created after the survivor)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
            done
          gh release upload "$TAG" "apps/mobile/Nexus-${SLUG}.aab" --clobber
          echo "::notice::AAB attached. Upload it at Play Console → Internal testing → Create new release."

  stores-ios:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: setup Rust (iOS targets)
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      # The EAS archive is taken from the working tree; these binaries are gitignored,
      # so they must exist on disk BEFORE `eas build`. Build scripts and Rust sources
      # are tracked; the sync scripts copy the results into the RN packages, which is
      # exactly what happens on a dev machine.
      - name: build native xcframeworks
        run: |
          (cd native-secp-poc && scripts/build-secp-xcframework.sh)
          (cd native-engine-ffi && scripts/build-engine-xcframework.sh)
          packages/react-native-secp-native/scripts/sync-xcframework.sh
          packages/react-native-engine-native/scripts/sync-xcframework.sh

      - name: install dependencies
        run: |
          npm ci
          npm ci --prefix apps/ui

      - name: bundle the chrome
        run: npm run ui:bundle

      # EXPO_APPLE_TEAM_ID: without it the build step's optional pre-flight cannot
      # ask which team, and logs "Input is required, but stdin is not readable.
      # Failed to display prompt: Apple Team ID" then "Skipping Provisioning Profile
      # validation on Apple Servers because we aren't authenticated". v0.1.0 shipped
      # anyway — the submit step authenticates separately and succeeded — but the
      # validation that would catch a bad profile before a 20-minute build was
      # silently skipped.
      # --auto-submit only on a tag, and this is the leg where that matters most: a
      # submitted TestFlight build consumes a build number and becomes visible to
      # testers, neither of which can be taken back. On a branch the IPA is built and
      # signed exactly as a release build is — which is the part that actually breaks —
      # and Apple never receives it.
      - name: build IPA (submit to TestFlight on a tag)
        working-directory: apps/mobile
        env:
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SUBMIT=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SUBMIT=(--auto-submit)
          else
            echo "::notice::rehearsal — building and signing the production IPA without submitting it to TestFlight"
          fi
          eas build --platform ios --profile production --non-interactive "${SUBMIT[@]}"

  apk:
    needs: verify-version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: install dependencies
        run: |
          npm ci
          npm ci --prefix apps/ui

      - name: bundle the chrome
        run: npm run ui:bundle

      # No --auto-submit here in either mode: the preview APK is for sideloading and
      # was never a store artifact. So this leg is identical on a tag and a rehearsal
      # apart from where the file ends up. SLUG for the same slash reason as the AAB.
      - name: build APK
        working-directory: apps/mobile
        run: |
          SLUG="${GITHUB_REF_NAME//\//-}"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          eas build --platform android --profile preview --non-interactive --json > build.json
          URL=$(node -p "JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.buildUrl")
          curl -fL "$URL" -o "Nexus-${SLUG}.apk"

      - name: upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: apps/mobile/Nexus-*.apk

      # Shared draft-release protocol with release-desktop.yml — BOTH sides must
      # follow it, or one side's artifacts get destroyed:
      #   1. never touch a PUBLISHED release (releases are immutable)
      #   2. never DELETE a draft (the other workflow may have already uploaded
      #      assets to it)
      #   3. view → create-if-absent → dedupe keeping the OLDEST draft, so a
      #      same-moment create race converges on one survivor before either side
      #      uploads
      #   4. upload with --clobber (reruns refresh their own assets in place)
      - name: attach APK to the draft release
        # Tags only, same reason as the AAB leg.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$TAG is already published — releases are immutable, cut a new version"
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Nexus ${TAG}" --notes "Nexus ${TAG} — built from ${GITHUB_SHA}" || true
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.draft and .tag_name == \"$TAG\")] | sort_by(.created_at) | .[1:] | .[].id" |
            while read -r id; do
              echo "removing duplicate draft $id (created after the survivor)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
            done
          gh release upload "$TAG" "apps/mobile/Nexus-${SLUG}.apk" --clobber
