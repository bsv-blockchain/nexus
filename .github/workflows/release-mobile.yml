# Mobile release: store builds and a sideloadable APK — on version tags ONLY,
# the same trigger as release-desktop.yml. Cutting a release is `npm run release`.
#
# Three legs:
#
#   stores-android   production AAB on EAS's builders, auto-submitted to Play's
#                    INTERNAL testing track (eas.json submit.production.android).
#                    Two preconditions are now met and both were required: a Google
#                    service account on EAS, and one manual AAB upload — Google will
#                    not let a service account create a new package's first release.
#                    Promotion from internal testing to production stays a Play
#                    Console act.
#
#   stores-ios       production IPA on EAS's builders, auto-submitted to TestFlight.
#                    eas.json now carries submit.production.ios.ascAppId
#                    (6797608340), which non-interactive submission requires — with
#                    an empty profile eas-cli refuses rather than resolving the id.
#                    Runs on macOS because the two Rust xcframeworks
#                    (SecpNative/EngineNative) are gitignored build products that
#                    exist only on dev machines — CI must rebuild them from the
#                    tracked Rust sources before the EAS archive is taken, or pod
#                    install dies on the EAS builder every time.
#
#   apk              signed installable APK (preview profile) for testers who
#                    sideload, attached to the tag's draft GitHub release beside the
#                    desktop artifacts. Android needs no xcframeworks — its native
#                    modules compile from tracked source on the EAS builder.
#
# No `--no-wait` anywhere: a queued-then-failed EAS build must fail THIS run, not
# silently evaporate behind a green checkmark.
name: release-mobile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # workflow_dispatch is for RE-RUNNING a tag's release: dispatch it on the tag
      # ref. Dispatched from a branch, GITHUB_REF_NAME is the branch name and no
      # release semantics exist — refuse loudly instead of failing weirdly later.
      - run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::this workflow releases tags — dispatch it on a vX.Y.Z tag, not '$GITHUB_REF_NAME'"
            exit 1
          fi
          node tools/version.mjs --check --tag "$GITHUB_REF_NAME"

  stores-android:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: install dependencies
        run: |
          npm ci
          npm ci --prefix apps/ui

      - name: bundle the chrome
        run: npm run ui:bundle

      - name: build and submit to Play internal testing (Android)
        working-directory: apps/mobile
        run: eas build --platform android --profile production --non-interactive --auto-submit

  stores-ios:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: setup Rust (iOS targets)
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      # The EAS archive is taken from the working tree; these binaries are gitignored,
      # so they must exist on disk BEFORE `eas build`. Build scripts and Rust sources
      # are tracked; the sync scripts copy the results into the RN packages, which is
      # exactly what happens on a dev machine.
      - name: build native xcframeworks
        run: |
          (cd native-secp-poc && scripts/build-secp-xcframework.sh)
          (cd native-engine-ffi && scripts/build-engine-xcframework.sh)
          packages/react-native-secp-native/scripts/sync-xcframework.sh
          packages/react-native-engine-native/scripts/sync-xcframework.sh

      - name: install dependencies
        run: |
          npm ci
          npm ci --prefix apps/ui

      - name: bundle the chrome
        run: npm run ui:bundle

      - name: build and submit to TestFlight (iOS)
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --non-interactive --auto-submit

  apk:
    needs: verify-version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: install dependencies
        run: |
          npm ci
          npm ci --prefix apps/ui

      - name: bundle the chrome
        run: npm run ui:bundle

      - name: build APK
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile preview --non-interactive --json > build.json
          URL=$(node -p "JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.buildUrl")
          curl -fL "$URL" -o "Nexus-${GITHUB_REF_NAME}.apk"

      # Shared draft-release protocol with release-desktop.yml — BOTH sides must
      # follow it, or one side's artifacts get destroyed:
      #   1. never touch a PUBLISHED release (releases are immutable)
      #   2. never DELETE a draft (the other workflow may have already uploaded
      #      assets to it)
      #   3. view → create-if-absent → dedupe keeping the OLDEST draft, so a
      #      same-moment create race converges on one survivor before either side
      #      uploads
      #   4. upload with --clobber (reruns refresh their own assets in place)
      - name: attach APK to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$TAG is already published — releases are immutable, cut a new version"
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Nexus ${TAG}" --notes "Nexus ${TAG} — built from ${GITHUB_SHA}" || true
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.draft and .tag_name == \"$TAG\")] | sort_by(.created_at) | .[1:] | .[].id" |
            while read -r id; do
              echo "removing duplicate draft $id (created after the survivor)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
            done
          gh release upload "$TAG" "apps/mobile/Nexus-${GITHUB_REF_NAME}.apk" --clobber
