# Desktop release: build, sign, and publish the Electron shell for macOS, Windows
# and Linux — on version tags ONLY. Merges to main build nothing and publish
# nothing; cutting a release is `npm run release` (tools/release.mjs), which stamps
# every metadata file, tags vX.Y.Z, and pushes. The tag is the sole trigger, so a
# release is always a deliberate, versioned act.
#
# The certificate and signing process deliberately MIRRORS bsv-desktop's release.yml
# (bsv-blockchain/bsv-desktop), including the secret names, so the org's existing
# secrets work here unchanged:
#
#   macOS    Developer ID p12 imported into a throwaway keychain; electron-builder
#            signs, and notarizes automatically because APPLE_ID /
#            APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are present in the env.
#            Notarization is required for distribution: Gatekeeper blocks a
#            downloaded, unnotarized Developer ID app on the recipient's machine.
#   Windows  DigiCert KeyLocker (Software Trust Manager). The app is built with
#            signing disabled, then the final installers are signed with signtool
#            against the KeyLocker certificate and verified.
#   Linux    GPG: detach-signed AppImage plus a signed SHA256SUMS manifest.
#
# Publishing model: every TAG run refreshes a DRAFT GitHub release. Making a draft
# public stays a human act.
#
# Dispatching this workflow on a BRANCH is a rehearsal: it builds, signs and
# notarizes exactly as a release does, and publishes nothing. Use it before cutting
# a tag whenever the packaging, signing or certificate path has changed —
#
#   gh workflow run release-desktop.yml --ref my-branch
#
# — because a tag cannot be un-cut, and the only failures this pipeline has ever had
# were ones no local build could reproduce.
name: release-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

# Serialize runs but never cancel: killing a run mid-notarization wastes an Apple
# submission, and killing it mid-upload strands a partial draft that looks complete.
# A superseded run just finishes and its draft is deleted by the next one.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag names a version; every metadata file must agree with it, or five
  # platforms would ship artifacts that disagree about what they are.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Two modes, decided by the ref:
      #
      #   a vX.Y.Z tag   a real release. Metadata must agree with the tag, and the
      #                  release job below publishes a draft.
      #   any branch     a REHEARSAL. Builds, signs and notarizes exactly as a
      #                  release does, and publishes nothing.
      #
      # This used to refuse the second case outright, which meant the only way to
      # find out whether the signing path worked was to cut a tag — and a tag is
      # forever. v0.1.0 was spent discovering that apps/desktop/build had never
      # been committed. A rehearsal costs runner minutes and one Apple
      # notarization; a burnt version number costs more.
      - run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node tools/version.mjs --check --tag "$GITHUB_REF_NAME"
          else
            echo "::notice title=Rehearsal::'$GITHUB_REF_NAME' is not a version tag — building and signing, publishing nothing."
            node tools/version.mjs --check
          fi

  build:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-2022
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-dev

      # Pin a concrete Node major (not lts/*): the alias lookup hits the
      # node-versions manifest and has failed releases before (bsv-desktop v2.7.1).
      # 24 matches the Node inside Electron 43 and build-main.mjs's target.
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Two installs, deliberately: apps/ui is NOT a workspace member (it pins its
      # own React), so the root install does not cover it. `npm ci` in apps/ui also
      # stops tools/build-ui.mjs from running its fallback `npm install` against a
      # lockfile-less resolution mid-build.
      - name: install dependencies
        run: |
          npm ci
          npm ci --prefix apps/ui

      # Build the chrome once and copy the rewritten export into apps/desktop/ui —
      # the same 28 MB the shell loads in dev, so CI ships exactly what was tested.
      - name: bundle the chrome
        run: npm run ui:bundle

      - name: bundle the Electron main process
        run: npm run build --workspace @nexus/desktop

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: import Apple Developer Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASS }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # 21600, not 3600: the keychain sits idle through both arches' notarytool
          # waits, and a >1h Apple queue stall would auto-lock it between the x64 and
          # arm64 signing passes.
          security set-keychain-settings -t 21600 -u build.keychain
          # create-keychain does NOT add the keychain to the user search list, and
          # electron-builder discovers identities with a bare `security find-identity`,
          # which consults the search list — not the default keychain.
          security list-keychains -d user -s build.keychain login.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      # Fails the job when the imported cert is missing or the wrong type — a bare
      # find-identity exits 0 even on "0 valid identities found".
      - name: verify certificate
        if: matrix.platform == 'macos-latest'
        run: |
          security find-identity -v -p codesigning build.keychain | grep "Developer ID Application: BSV"

      - name: build, sign and notarize (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          # electron-builder finds the identity in the keychain on its own
          # (CSC_IDENTITY_AUTO_DISCOVERY defaults to true) and generates notarize
          # options from these three variables. Remove one and it silently ships an
          # unnotarized artifact, so keep all three or none.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Sign against the imported keychain explicitly rather than trusting
          # search-list discovery alone.
          CSC_KEYCHAIN: build.keychain
        working-directory: apps/desktop
        # forceCodeSigning turns "skipped macOS application code signing" from a
        # warning into a failure. Without it, a rotated secret ships an unsigned,
        # unnotarized dmg on a green build. CI-only: local `pack:mac` stays free to
        # build unsigned.
        run: npx electron-builder --mac --publish never -c.forceCodeSigning=true

      # Notarization can also silently skip (it only warns when its env is absent),
      # so prove the artifact rather than trust the log: signature chain, Gatekeeper
      # assessment, and the stapled ticket.
      - name: verify signature and notarization (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          find apps/desktop/out -maxdepth 2 -name "*.app" -type d | while read -r APP; do
            echo "--- $APP ---"
            codesign --verify --deep --strict "$APP"
            spctl -a -vv -t exec "$APP"
            xcrun stapler validate "$APP"
          done

      - name: upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: macos-artifacts
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/latest-mac.yml

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: build (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: apps/desktop
        run: npx electron-builder --linux --publish never

      - name: import GPG key
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APP_IMAGE_GPG_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --import

      - name: sign AppImage and SHA256SUMS
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: apps/desktop/out
        # nullglob + explicit lists, and hard failures: with plain globs an unmatched
        # pattern is passed literally, sha256sum's error hides behind 2>/dev/null, and
        # the one artifact whose whole purpose is integrity gets signed while partial
        # or empty.
        run: |
          shopt -s nullglob
          appimages=( *.AppImage )
          if [ ${#appimages[@]} -eq 0 ]; then
            echo "::error::no AppImage produced"
            exit 1
          fi
          for a in "${appimages[@]}"; do
            gpg --detach-sign --armor "$a"
          done
          files=( *.AppImage *.deb )
          sha256sum "${files[@]}" > SHA256SUMS
          gpg --detach-sign --armor SHA256SUMS

      - name: upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v6
        with:
          name: linux-artifacts
          path: |
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.AppImage.asc
            apps/desktop/out/*.deb
            apps/desktop/out/SHA256SUMS
            apps/desktop/out/SHA256SUMS.asc
            apps/desktop/out/latest-linux.yml

      # ── Windows ────────────────────────────────────────────────────────────
      - name: decode DigiCert client certificate
        if: matrix.platform == 'windows-2022'
        shell: bash
        run: |
          echo "${{ secrets.DIGICERT_CLIENT_AUTH_CERT }}" | base64 --decode > /d/sm_client_cert.p12
          echo "SM_HOST=${{ secrets.DIGICERT_HOST }}" >> "$GITHUB_ENV"
          echo "SM_API_KEY=${{ secrets.DIGICERT_KEY_LOCKER_API_KEY }}" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_FILE=D:\\sm_client_cert.p12" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.DIGICERT_CLIENT_AUTH_PASS }}" >> "$GITHUB_ENV"

      - name: setup DigiCert Software Trust Manager
        if: matrix.platform == 'windows-2022'
        uses: digicert/code-signing-software-trust-action@v1
        env:
          SM_HOST: ${{ env.SM_HOST }}
          SM_API_KEY: ${{ env.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ env.SM_CLIENT_CERT_PASSWORD }}

      - name: sync certificate to Windows store
        if: matrix.platform == 'windows-2022'
        shell: cmd
        run: smctl windows certsync

      # ── Windows signing happens INSIDE electron-builder ──────────────────
      #
      # build/win-sign.cjs is wired as `win.signtoolOptions.sign`, so signtool runs
      # on each artifact as part of packaging and BEFORE electron-builder computes
      # the sha512 that goes into latest.yml.
      #
      # It used to be a step after this one, re-signing every .exe in out/. That
      # was harmless while nothing published update metadata and became a bug the
      # moment something did: signing changes bytes, so latest.yml would have
      # carried the hash of the pre-re-sign installer and every Windows client
      # would have aborted with "sha512 checksum mismatch". bsv-desktop shipped
      # precisely that in v2.6.x and v2.7.x and had to write a script to repair the
      # metadata of releases already in the wild — see its
      # scripts/repair-published-update-metadata.mjs. The hook is how that class of
      # fault is made unreachable rather than merely avoided.
      #
      # The certificate reaches signtool the same way it always has: `smctl windows
      # certsync` above puts it in the Windows store and the hook selects it by
      # thumbprint. The hook refuses to produce unsigned artifacts when CI is set,
      # so a rotated or missing secret fails the build instead of publishing an
      # installer nobody can verify.
      - name: build and sign (Windows)
        if: matrix.platform == 'windows-2022'
        working-directory: apps/desktop
        env:
          WIN_SIGN_SHA1: ${{ secrets.DIGICERT_CODE_SIGNING_SHA1_HASH }}
        run: npx electron-builder --win --x64 --publish never

      # A gate, not a diagnostic. The installer is the artifact users run and the
      # one latest.yml names, so an unverifiable signature on it must stop the
      # release here rather than surface as a SmartScreen warning on a desktop.
      - name: verify Windows signature and update metadata
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found." }

          $installer = Get-ChildItem "apps/desktop/out/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "no installer produced" }
          & $signtool verify /pa $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($installer.Name)" }

          # The whole point of moving signing into the build: prove that what
          # latest.yml describes is the file we are about to publish. This is the
          # check that would have caught bsv-desktop's mismatch before release
          # rather than on users' machines.
          $yml = "apps/desktop/out/latest.yml"
          if (-not (Test-Path $yml)) { throw "latest.yml was not produced — auto-update would ship nothing" }
          $declared = (Select-String -Path $yml -Pattern '^\s+sha512:\s*(.+)$' | Select-Object -First 1).Matches.Groups[1].Value.Trim()
          $actual = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::Create().ComputeHash([System.IO.File]::ReadAllBytes($installer.FullName)))
          if ($declared -ne $actual) {
            throw "latest.yml sha512 does not match $($installer.Name) — auto-update would abort on every client"
          }
          Write-Host "latest.yml matches $($installer.Name)"

      - name: upload Windows artifacts
        if: matrix.platform == 'windows-2022'
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts
          path: |
            apps/desktop/out/*.exe
            apps/desktop/out/latest.yml

  release:
    needs: build
    # Tags only. A rehearsal proves the artifacts can be built and signed; it must
    # not leave a draft release behind for a version nobody cut. The artifacts are
    # still downloadable from the run's own Artifacts panel.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Shared draft-release protocol with release-mobile.yml — BOTH sides must
      # follow it, or one side's artifacts get destroyed. (The first cut of this job
      # deleted "stale" drafts wholesale; review traced the race — the mobile APK
      # often lands before a 3-platform build + notarization finishes, and deleting
      # the draft deletes its assets.)
      #   1. never touch a PUBLISHED release (releases are immutable)
      #   2. never DELETE a draft that might hold the other workflow's assets
      #   3. view → create-if-absent → dedupe keeping the OLDEST draft, so a
      #      same-moment create race converges on one survivor before uploads
      #   4. upload with --clobber (reruns refresh their own assets in place)
      # Publishing the draft is deliberately left to a person.
      - name: create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"

          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$TAG is already published — releases are immutable, cut a new version"
            exit 1
          fi

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Nexus ${TAG}" --notes "Nexus ${TAG} — built from ${GITHUB_SHA}" || true
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.draft and .tag_name == \"$TAG\")] | sort_by(.created_at) | .[1:] | .[].id" |
            while read -r id; do
              echo "removing duplicate draft $id (created after the survivor)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
            done

          for file in artifacts/*/*; do
            if [ -f "$file" ]; then
              gh release upload "$TAG" "$file" --clobber
            fi
          done
